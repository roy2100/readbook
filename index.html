<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadBook — EPUB 朗读器</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div id="book-title">ReadBook</div>
      <label id="upload-btn" for="file-input">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        打开 EPUB
        <input type="file" id="file-input" accept=".epub" hidden>
      </label>
    </header>

    <!-- Main content -->
    <div id="main">

      <!-- Sidebar: chapter list -->
      <aside id="sidebar">
        <div id="sidebar-header">目录</div>
        <nav id="toc-list">
          <div class="toc-placeholder">请先打开 EPUB 文件</div>
        </nav>
      </aside>

      <!-- Reader pane -->
      <main id="reader">
        <div id="reader-content">
          <div class="welcome">
            <div class="welcome-icon">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
              </svg>
            </div>
            <h2>EPUB 朗读器</h2>
            <p>点击右上角「打开 EPUB」按钮，选择电子书文件开始阅读</p>
            <ul>
              <li>支持 EPUB 2 / EPUB 3 格式</li>
              <li>中英文语音朗读</li>
              <li>句子高亮跟读</li>
              <li>调节速度与音色</li>
            </ul>
          </div>
        </div>
      </main>

    </div>

    <!-- Bottom control bar -->
    <footer id="controls">
      <div id="controls-left">
        <button id="btn-prev" class="ctrl-btn" title="上一章" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span id="chapter-indicator">—</span>
        <button id="btn-next" class="ctrl-btn" title="下一章" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

      <div id="controls-center">
        <button id="btn-play" class="ctrl-btn ctrl-btn-primary" title="播放" disabled>
          <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <button id="btn-stop" class="ctrl-btn" title="停止" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>
      </div>

      <div id="controls-right">
        <label class="ctrl-label">
          <span>速度</span>
          <select id="speed-select">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1.0×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2.0×</option>
          </select>
        </label>
        <label class="ctrl-label">
          <span>音色</span>
          <select id="voice-select">
            <option value="">默认</option>
          </select>
        </label>
      </div>
    </footer>

  </div>

  <!-- Error toast -->
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
